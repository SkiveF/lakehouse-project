services:

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  spark:
    image: apache/spark:3.5.0
    container_name: spark
    user: root
    environment:
      SPARK_S3A_ACCESS_KEY: ${SPARK_S3A_ACCESS_KEY}
      SPARK_S3A_SECRET_KEY: ${SPARK_S3A_SECRET_KEY}
      METASTORE_JDBC_URL: ${METASTORE_JDBC_URL}
      METASTORE_USER: ${METASTORE_USER}
      METASTORE_PASSWORD: ${METASTORE_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install pyyaml 2>/dev/null || pip3 install pyyaml 2>/dev/null
        JAR_DIR=/opt/spark/jars
        if [ ! -f $$JAR_DIR/hadoop-aws-3.3.4.jar ]; then
          echo "Downloading Hadoop AWS JARs..."
          curl -sL -o $$JAR_DIR/hadoop-aws-3.3.4.jar \
            https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar
          curl -sL -o $$JAR_DIR/aws-java-sdk-bundle-1.12.262.jar \
            https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar
        fi
        if [ ! -f $$JAR_DIR/postgresql.jar ]; then
          echo "Downloading PostgreSQL JDBC driver..."
          curl -sL -o $$JAR_DIR/postgresql.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
        fi
        mkdir -p /opt/spark/conf
        sed -e "s|@@METASTORE_JDBC_URL@@|$$METASTORE_JDBC_URL|" \
            -e "s|@@METASTORE_USER@@|$$METASTORE_USER|" \
            -e "s|@@METASTORE_PASSWORD@@|$$METASTORE_PASSWORD|" \
            /opt/spark/conf/hive-site.xml.template > /opt/spark/conf/hive-site.xml
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ../:/opt/project
      - ./hive-conf/hive-site.xml.template:/opt/spark/conf/hive-site.xml.template:ro

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    user: root
    depends_on:
      - spark
    environment:
      METASTORE_JDBC_URL: ${METASTORE_JDBC_URL}
      METASTORE_USER: ${METASTORE_USER}
      METASTORE_PASSWORD: ${METASTORE_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install pyyaml 2>/dev/null || pip3 install pyyaml 2>/dev/null
        JAR_DIR=/opt/spark/jars
        if [ ! -f $$JAR_DIR/hadoop-aws-3.3.4.jar ]; then
          curl -sL -o $$JAR_DIR/hadoop-aws-3.3.4.jar \
            https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar
          curl -sL -o $$JAR_DIR/aws-java-sdk-bundle-1.12.262.jar \
            https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar
        fi
        if [ ! -f $$JAR_DIR/postgresql.jar ]; then
          curl -sL -o $$JAR_DIR/postgresql.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
        fi
        mkdir -p /opt/spark/conf
        sed -e "s|@@METASTORE_JDBC_URL@@|$$METASTORE_JDBC_URL|" \
            -e "s|@@METASTORE_USER@@|$$METASTORE_USER|" \
            -e "s|@@METASTORE_PASSWORD@@|$$METASTORE_PASSWORD|" \
            /opt/spark/conf/hive-site.xml.template > /opt/spark/conf/hive-site.xml
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark:7077
    volumes:
      - ../:/opt/project
      - ./hive-conf/hive-site.xml.template:/opt/spark/conf/hive-site.xml.template:ro

  # ── Airflow ── orchestrateur du pipeline Bronze → dbt
  airflow:
    image: apache/airflow:2.9.1
    container_name: airflow
    user: root
    depends_on:
      - spark
    ports:
      - "8081:8080"
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install docker 2>/dev/null
        airflow db migrate
        airflow users create --username admin --firstname Admin --lastname User \
          --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD} 2>/dev/null || true
        airflow scheduler &
        exec airflow webserver --port 8080
    volumes:
      - ../dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock

  # ── Spark Thrift Server ── expose HiveServer2 pour dbt-spark (thrift)
  # Metastore → PostgreSQL (persistant, partagé, pas de perte au restart)
  spark-thrift:
    image: apache/spark:3.5.0
    container_name: spark-thrift
    user: root
    depends_on:
      - spark
    environment:
      METASTORE_JDBC_URL: ${METASTORE_JDBC_URL}
      METASTORE_USER: ${METASTORE_USER}
      METASTORE_PASSWORD: ${METASTORE_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        JAR_DIR=/opt/spark/jars
        if [ ! -f $$JAR_DIR/hadoop-aws-3.3.4.jar ]; then
          curl -sL -o $$JAR_DIR/hadoop-aws-3.3.4.jar \
            https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar
          curl -sL -o $$JAR_DIR/aws-java-sdk-bundle-1.12.262.jar \
            https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar
        fi
        if [ ! -f $$JAR_DIR/postgresql.jar ]; then
          echo "Downloading PostgreSQL JDBC driver..."
          curl -sL -o $$JAR_DIR/postgresql.jar \
            https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
        fi
        mkdir -p /opt/spark/conf
        sed -e "s|@@METASTORE_JDBC_URL@@|$$METASTORE_JDBC_URL|" \
            -e "s|@@METASTORE_USER@@|$$METASTORE_USER|" \
            -e "s|@@METASTORE_PASSWORD@@|$$METASTORE_PASSWORD|" \
            /opt/spark/conf/hive-site.xml.template > /opt/spark/conf/hive-site.xml
        /opt/spark/sbin/start-thriftserver.sh \
          --master spark://spark:7077 \
          --total-executor-cores ${THRIFT_TOTAL_CORES:-4} \
          --executor-memory ${THRIFT_EXECUTOR_MEMORY:-1g} \
          --hiveconf hive.server2.thrift.port=10000 \
          --hiveconf hive.server2.thrift.bind.host=0.0.0.0 \
          --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000 \
          --conf spark.hadoop.fs.s3a.access.key=${SPARK_S3A_ACCESS_KEY} \
          --conf spark.hadoop.fs.s3a.secret.key=${SPARK_S3A_SECRET_KEY} \
          --conf spark.hadoop.fs.s3a.path.style.access=true \
          --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem \
          --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false \
           --conf spark.sql.legacy.allowNonEmptyLocationInCTAS=true
         echo "Spark Thrift Server started (metastore to PostgreSQL)"
         tail -f /opt/spark/logs/*
    ports:
      - "10000:10000"
    volumes:
      - ../:/opt/project
      - ./hive-conf/hive-site.xml.template:/opt/spark/conf/hive-site.xml.template:ro
      - ./hive-conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf

  # ── dbt ── Silver + Gold via dbt run
  dbt:
    image: python:3.11-slim
    container_name: dbt
    depends_on:
      - spark-thrift
    working_dir: /opt/project/lakehouse_dbt
    environment:
      - DBT_PROFILES_DIR=/opt/project/lakehouse_dbt
    volumes:
      - ../:/opt/project
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        pip install --quiet dbt-core "dbt-spark[PyHive]"
        echo "dbt ready - container active"
        tail -f /dev/null

  # ── Apache Zeppelin ── notebook SQL interactif
  zeppelin:
    image: apache/zeppelin:0.11.1
    container_name: zeppelin
    depends_on:
      - spark-thrift
    ports:
      - "8085:8080"
    environment:
      - ZEPPELIN_ADDR=0.0.0.0
      - ZEPPELIN_PORT=8080
    volumes:
      - zeppelin_notebooks:/zeppelin/notebook
      - zeppelin_logs:/zeppelin/logs

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/apache/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092


volumes:
  minio_data:
  kafka_data:
  zeppelin_notebooks:
  zeppelin_logs:
